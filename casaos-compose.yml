name: OpenHost
services:
  openhost:
    image: ghcr.io/stuffzez/openhost:latest
    container_name: openhost-main
    ports:
      - "3000:3000"
      - "80:80"
      - "443:443"
    volumes:
      - /DATA/AppData/openhost/deployments:/app/deployments
      - /DATA/AppData/openhost/builds:/app/builds
      - /DATA/AppData/openhost/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=openhost-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=openhost
      - POSTGRES_USER=openhost
      - POSTGRES_PASSWORD=changeme123
      - REDIS_HOST=openhost-redis
      - REDIS_PORT=6379
      - JWT_SECRET=change-this-secret-key
      - ADMIN_EMAIL=admin@openhost.local
      - ADMIN_PASSWORD=admin123
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - openhost-network
    x-casaos:
      author: StuffzEZ
      category: Development
      description: Self-hosted deployment platform for code, websites, and databases.
      developer: StuffzEZ
      icon: https://raw.githubusercontent.com/StuffzEZ/OpenHost/main/public/favicon.ico
      main: openhost
      port_map: "80"
      scheme: http
      title: OpenHost
      tagline: Your self-hosted Vercel alternative.

  postgres:
    image: postgres:15-alpine
    container_name: openhost-postgres
    environment:
      - POSTGRES_DB=openhost
      - POSTGRES_USER=openhost
      - POSTGRES_PASSWORD=changeme123
    volumes:
      - /DATA/AppData/openhost/pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - openhost-network

  redis:
    image: redis:7-alpine
    container_name: openhost-redis
    volumes:
      - /DATA/AppData/openhost/redisdata:/data
    restart: unless-stopped
    networks:
      - openhost-network

networks:
  openhost-network:
    driver: bridge
