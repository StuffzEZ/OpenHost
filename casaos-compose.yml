name: OpenHost
services:
  openhost:
    image: ghcr.io/stuffzez/openhost:latest
    container_name: openhost-main
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /DATA/AppData/openhost/deployments:/app/deployments
      - /DATA/AppData/openhost/builds:/app/builds
      - /DATA/AppData/openhost/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=openhost-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=openhost
      - POSTGRES_USER=openhost
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@openhost.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - openhost-network
    x-casaos:
      author: StuffzEZ
      category: Development
      description: Full-featured self-hosted deployment platform with RBAC, resource limiting, and admin approvals.
      developer: StuffzEZ
      icon: https://raw.githubusercontent.com/StuffzEZ/OpenHost/main/public/favicon.ico
      main: openhost
      port_map: "80"
      scheme: http
      title: OpenHost
      tagline: Your self-hosted Vercel alternative with RBAC and resource management.

  postgres:
    image: postgres:15-alpine
    container_name: openhost-postgres
    environment:
      - POSTGRES_DB=openhost
      - POSTGRES_USER=openhost
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - /DATA/AppData/openhost/pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - openhost-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openhost -d openhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: openhost-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - /DATA/AppData/openhost/redisdata:/data
    restart: unless-stopped
    networks:
      - openhost-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  openhost-network:
    driver: bridge
