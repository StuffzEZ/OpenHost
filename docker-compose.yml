version: "3.8"

services:
  openhost:
    build: .
    container_name: openhost-main
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - openhost-deployments:/app/deployments
      - openhost-builds:/app/builds
      - openhost-data:/app/data
      - openhost-nginx:/app/nginx-configs
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
      - PORT=3000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-openhost}
      - POSTGRES_USER=${POSTGRES_USER:-openhost}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@openhost.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - openhost-network
    deploy:
      resources:
        limits:
          memory: 2g

  postgres:
    image: postgres:15-alpine
    container_name: openhost-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-openhost}
      - POSTGRES_USER=${POSTGRES_USER:-openhost}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - openhost-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - openhost-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openhost} -d ${POSTGRES_DB:-openhost}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: openhost-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - openhost-redis:/data
    restart: unless-stopped
    networks:
      - openhost-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  openhost-deployments:
  openhost-builds:
  openhost-data:
  openhost-nginx:
  openhost-postgres:
  openhost-redis:

networks:
  openhost-network:
    name: openhost-network
    driver: bridge
