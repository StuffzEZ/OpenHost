version: "3.8"

services:
  openhost:
    build: .
    container_name: openhost-main
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployments:/app/deployments
      - ./builds:/app/builds
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=openhost
      - POSTGRES_USER=openhost
      - POSTGRES_PASSWORD=changeme123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_HOST=mongodb
      - JWT_SECRET=change-this-secret-key
      - ADMIN_EMAIL=admin@openhost.local
      - ADMIN_PASSWORD=admin123
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN:-}
      - DUCKDNS_ROOT_DOMAIN=${DUCKDNS_ROOT_DOMAIN:-}
    depends_on:
      - postgres
      - redis
      - mongodb
    restart: unless-stopped
    networks:
      - openhost-network

  postgres:
    image: postgres:15-alpine
    container_name: openhost-postgres
    environment:
      - POSTGRES_DB=openhost
      - POSTGRES_USER=openhost
      - POSTGRES_PASSWORD=changeme123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - openhost-network

  redis:
    image: redis:7-alpine
    container_name: openhost-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - openhost-network

  mongodb:
    image: mongo:6
    container_name: openhost-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped
    networks:
      - openhost-network

volumes:
  postgres-data:
  redis-data:
  mongodb-data:

networks:
  openhost-network:
    name: openhost-network
    driver: bridge
